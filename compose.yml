services:
  db:
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: racing-league-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-racing_league}
      POSTGRES_USER: ${DB_USERNAME:-racing_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set; copy .env.example to .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - racing-league-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-racing_user} -d ${DB_NAME:-racing_league}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - racing-league-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: racing-league-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-racing_league}
      DB_USERNAME: ${DB_USERNAME:-racing_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set; copy .env.example to .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set; copy .env.example to .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      SERVER_PORT: 8080
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - racing-league-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    container_name: racing-league-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - racing-league-net

volumes:
  racing-league-db-data:
    name: racing-league-db-data

networks:
  racing-league-net:
    name: racing-league-net

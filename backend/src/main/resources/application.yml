spring:
  application:
    name: racing-league
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:racing_league}
    username: ${DB_USERNAME:racing_user}
    password: ${DB_PASSWORD:racing_pass}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-env}
    expiration-ms: ${JWT_EXPIRATION:3600000}

server:
  port: ${SERVER_PORT:8080}

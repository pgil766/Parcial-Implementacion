spring:
  application:
    name: racing-league
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:6969}/${DB_NAME:racing_league}
    username: ${DB_USERNAME:racing_user}
    password: ${DB_PASSWORD:racing_pass}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # HS256 needs at least 256 bits of key material, so this dev-only fallback is
    # 32+ characters. Real deployments must override it with JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-env-0123456789}
    expiration-ms: ${JWT_EXPIRATION:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

server:
  port: ${SERVER_PORT:8080}
